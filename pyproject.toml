[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wsb-signals"
version = "0.0.1"
description = "Near-live r/wallstreetbets trending radar — WSB Heat vs Market Heat."
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "duckdb>=0.10",
    "streamlit>=1.30",   # Phase 1 minimal dashboard (reads the JSON snapshot; pulls pandas)
]

[project.optional-dependencies]
analytics = ["polars>=0.20"]   # not required by v0.0.1 (aggregation is SQL + stdlib)
dev = ["pytest>=8"]

[project.scripts]
wsb = "wsb_signals.cli:main"

[tool.setuptools]
packages = ["wsb_signals", "wsb_signals.sources", "wsb_signals.market"]

[tool.uv]
# Incus/overlay fs: uv cache and .venv live on different filesystems → copy instead of
# hardlink (quiets the "Failed to hardlink files" sync warning). Harmless elsewhere.
link-mode = "copy"
