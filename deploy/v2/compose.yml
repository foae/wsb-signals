# WSB Signals v2 — Postgres, worker, and read-only web board.
#
#   docker compose -f deploy/v2/compose.yml up -d --build
#   docker compose -f deploy/v2/compose.yml logs -f worker
#   docker compose -f deploy/v2/compose.yml down            # keeps named volumes
#   docker compose -f deploy/v2/compose.yml down -v         # removes all history and media
#
# Services use Compose's default bridge network. Postgres is intentionally internal-only;
# the worker and web connect to it by the service hostname `db`. The board is published only
# on the Docker host's loopback interface at http://127.0.0.1:3000.
name: wsb-signals-v2

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wsb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-wsb_signals}
    volumes:
      # postgres:18+ stores PGDATA in a version-specific child directory, so mount its parent.
      - wsb-v2-pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wsb} -d ${POSTGRES_DB:-wsb_signals}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Single Postgres writer. It migrates on boot and uses an advisory lock, so do not scale it.
  worker:
    build:
      context: ../..
      dockerfile: deploy/v2/worker.Dockerfile
    image: wsb-worker:latest
    restart: unless-stopped
    # Allow an in-flight LLM call and the graceful two-loop wind-down to finish on SIGTERM.
    stop_grace_period: 60s
    env_file: .env
    # OAuth is opt-in through the private overlay documented in README.md. Clearing this also
    # prevents a legacy CODEX_AUTH_FILE value in .env from enabling a missing mount.
    environment:
      CODEX_AUTH_FILE: ""
    volumes:
      - wsb-v2-data:/app/data
      # The worker writes media; the web mounts this same volume read-only.
      - wsb-v2-media:/app/data/media
    depends_on:
      db:
        condition: service_healthy
    # This freshness probe reports the state of the live ingest source.
    healthcheck:
      test: ["CMD", "pnpm", "-C", "packages/worker", "heartbeat"]
      interval: 10m
      timeout: 90s
      retries: 2
      start_period: 3m

  # Nuxt SSR board. Its database role is provisioned by the worker and is read-only.
  web:
    build:
      context: ../..
      dockerfile: deploy/v2/web.Dockerfile
    image: wsb-web:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - wsb-v2-media:/app/data/media:ro
    environment:
      NUXT_DATABASE_URL: ${NUXT_DATABASE_URL:?NUXT_DATABASE_URL must be set in .env}
      NITRO_PORT: 3000
      HOST: 0.0.0.0
      NUXT_MEDIA_DIR: /app/data/media/plays
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  # All named volumes survive restarts and `docker compose down`; only `down -v` removes them.
  wsb-v2-pg:
  wsb-v2-data:
  wsb-v2-media:
