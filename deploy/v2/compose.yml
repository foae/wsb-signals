# WSB Signals v2 — full deploy: db + worker + web (3 services).
# The frozen Python radar is NOT deployed — it is the parity oracle only.
#
#   docker compose -f deploy/v2/compose.yml up -d --build
#   docker compose -f deploy/v2/compose.yml logs -f worker
#   docker compose -f deploy/v2/compose.yml logs -f web
#   docker compose -f deploy/v2/compose.yml ps
#   docker compose -f deploy/v2/compose.yml down            # volumes (PG data + worker data dir) survive
#   docker compose -f deploy/v2/compose.yml down -v         # WIPES all volumes (loses history)
#
# NETWORKING — this host is Docker-inside-Incus/LXC, where the default docker bridge has NO egress
# (NAT through the nested netns fails), so all services use `network_mode: host` and the build uses
# `network: host`. The worker MUST have egress (Arctic-Shift + Alpaca + heartbeat).
# With host networking Postgres is reachable at localhost:5432, so DATABASE_URL must use localhost.
# The web board is reachable at http://localhost:3000 (no port mapping needed with host networking).
#
# ON A NORMAL DOCKER HOST: drop `network_mode: host` from all services and `network: host` from the
# builds, put all services on the default bridge, and use service names in connection URLs:
#   DATABASE_URL=postgres://<user>:<pw>@db:5432/<dbname>
#   NUXT_DATABASE_URL=postgres://<web_ro_user>:<web_ro_pw>@db:5432/<dbname>
# Add explicit port mappings to expose services externally:
#   db:     ports: ["5432:5432"]    (if external DB access is needed)
#   web:    ports: ["3000:3000"]    (to reach the board from outside the host)
name: wsb-signals-v2

services:

  # ── Postgres ──────────────────────────────────────────────────────────────
  # Named volume persists all DB data across restarts and recreates.
  # Only `down -v` deletes it (intentional — don't unless wiping history).
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    network_mode: host
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wsb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-wsb_signals}
    volumes:
      # postgres:18+ images keep PGDATA in a version-specific subdirectory and require the mount
      # one level up, at /var/lib/postgresql — mounting .../data makes the entrypoint refuse to start.
      - wsb-v2-pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wsb} -d ${POSTGRES_DB:-wsb_signals}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Worker ────────────────────────────────────────────────────────────────
  # The SINGLE Postgres writer. Runs the 5-min poll loop; acquires an advisory lock on boot so
  # a second instance fails fast rather than double-writing. Runs migrateToLatest on boot — no
  # separate migration step needed. Do not scale beyond 1 replica.
  worker:
    build:
      context: ../..
      dockerfile: deploy/v2/worker.Dockerfile
      network: host          # build-time egress to npmjs.com (nested-bridge has none); harmless elsewhere
    image: wsb-worker:latest
    restart: unless-stopped
    network_mode: host       # runtime egress to Arctic-Shift / Alpaca / heartbeat
    env_file: .env           # provides DATABASE_URL, ALPACA_API_KEY, ALPACA_API_SECRET (see .env.example)
    volumes:
      - wsb-v2-data:/app/data
      # Plays media archive (plays-plan §1): worker writes screenshots under data/media/plays/<post_id>/;
      # the web mounts the SAME volume read-only and serves it via /api/media/**.
      - wsb-v2-media:/app/data/media
    depends_on:
      db:
        condition: service_healthy
    # Heartbeat = Arctic-Shift freshness probe. Exits non-zero when the sole live tap is stale or
    # down → container shows `unhealthy` in `docker compose ps`. See deploy/v2/README.md
    # ("Healthcheck and the freshness runbook") for the stale/down response playbook.
    healthcheck:
      test: ["CMD", "pnpm", "-C", "packages/worker", "heartbeat"]
      interval: 10m
      # 90s covers two sequential Arctic-Shift probes (each up to ingest.request_timeout=60s on a
      # slow-but-alive tap) plus the pnpm/tsx spawn — a 30s timeout could kill a recoverable probe.
      timeout: 90s
      retries: 2
      start_period: 3m

  # ── Web ──────────────────────────────────────────────────────────────────────
  # Nuxt 4 SSR read-only board. Connects to Postgres via the read-only role
  # provisioned by the worker on boot (WEB_RO_USER / WEB_RO_PASSWORD). The worker
  # must have run at least once before the web service is meaningful (the role is
  # created by the worker's ensure-read-role boot step, not by an init script).
  # NUXT_DATABASE_URL is set in .env; it must reference the same credentials as
  # WEB_RO_USER / WEB_RO_PASSWORD and the same POSTGRES_DB.
  # The board is available at http://localhost:3000 (host networking) once healthy.
  web:
    build:
      context: ../..
      dockerfile: deploy/v2/web.Dockerfile
      network: host          # build-time egress to npmjs.com (nested-bridge has none); harmless elsewhere
    image: wsb-web:latest
    restart: unless-stopped
    network_mode: host       # runtime: web binds :3000 on the host; reaches Postgres at localhost:5432
    env_file: .env           # provides NUXT_DATABASE_URL (see .env.example)
    volumes:
      - wsb-v2-media:/app/data/media:ro   # plays screenshots — read-only; served via /api/media/**
    environment:
      NITRO_PORT: 3000
      HOST: 0.0.0.0
      NUXT_MEDIA_DIR: /app/data/media/plays
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  # wsb-v2-pg: Postgres data — persists across restarts/recreates; only `down -v` wipes it.
  wsb-v2-pg:
  # wsb-v2-data: worker data dir (/app/data — .last_poll).
  wsb-v2-data:
  # wsb-v2-media: plays media archive — worker writes, web reads (~500 MB/month at ~45 plays/day;
  # a retention/pruning knob lands with P6 — plays-plan §8).
  wsb-v2-media:
