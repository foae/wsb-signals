packages:
  - packages/*
allowBuilds:
  # Build: Nuxt's native file-watcher, the Vue-version shim @vueuse needs, and the JS bundler.
  '@parcel/watcher': true
  vue-demi: true
  esbuild: true
  # Don't build: testcontainers/dockerode transitive deps — ssh2 runs pure-JS for local Docker,
  # cpu-features is just an ssh2 crypto accel, protobufjs's postinstall is only its CLI. None needed.
  ssh2: false
  cpu-features: false
  protobufjs: false
  # Build: @nuxt/eslint's native (oxc-based) import resolver.
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@nuxt/ui@4.8.2'
overrides:
  # Security floors for two vulnerable transitive esbuilds whose parents pin old ranges
  # (GHSA dev-server advisories; parents checked 2026-08-18 — no fixed release to bump to).
  # Scoped to the offending edges so the rest of the tree keeps its own esbuild pins.
  '@esbuild-kit/core-utils>esbuild': ^0.25.0 # drizzle-kit's legacy loader chain (devDep)
  'fontless>esbuild': ^0.28.1 # @nuxt/ui → @nuxt/fonts → fontless
