packages:
  - packages/*
allowBuilds:
  # Build: Nuxt's native file-watcher, the Vue-version shim @vueuse needs, and the JS bundler.
  '@parcel/watcher': true
  vue-demi: true
  esbuild: true
  # Don't build: testcontainers/dockerode transitive deps — ssh2 runs pure-JS for local Docker,
  # cpu-features is just an ssh2 crypto accel, protobufjs's postinstall is only its CLI. None needed.
  ssh2: false
  cpu-features: false
  protobufjs: false
  # Build: @nuxt/eslint's native (oxc-based) import resolver.
  unrs-resolver: true
minimumReleaseAge: 4320
overrides:
  # Security floor for the vulnerable esbuild pinned by drizzle-kit's legacy loader chain.
  # Scoped to that edge so the rest of the tree keeps its own esbuild pins.
  '@esbuild-kit/core-utils>esbuild': ^0.25.0
  # fontless still pins an esbuild with a Windows dev-server file-read advisory.
  'fontless>esbuild': ^0.28.1
